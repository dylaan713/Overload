<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
<!-- Overload: a teal dumbbell, angled upward, on Midnight. 1024 master; PNGs via `npx pwa-assets-generator`. --><defs>
